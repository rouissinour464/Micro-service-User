# =========================
# SERVER
# =========================
server:
  port: 8081

# =========================
# SPRING CONFIG
# =========================
spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      indent-output: true

# =========================
# JWT
# =========================
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

# =========================
# ACTUATOR & PROMETHEUS
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

# =========================
# LOGGING — JSON pour Fluent Bit → OpenSearch
# =========================
logging:
  level:
    root: INFO
    com.pfe.auth: DEBUG                     # ← Tes classes métier en DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN                 # Pas de spam SQL en prod
    org.springframework.web: INFO

  # Format JSON structuré — parsé directement par Fluent Bit
  # Chaque ligne = 1 document JSON dans OpenSearch
  pattern:
    console: |
      {"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z',UTC}","level":"%level","service":"auth-service","thread":"%thread","logger":"%logger{40}","message":"%replace(%msg){'\"','\\\"'}","trace":"%X{traceId:-}","span":"%X{spanId:-}"}%n